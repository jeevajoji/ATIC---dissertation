name: ATIC codec tests

on:
  push:
    branches:
      - final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codec-round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATIC_REQUIRE_CODEC_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU codec dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch==2.6.0 \
            torchvision==0.21.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            compressai==1.2.8 \
            timm==0.6.13 \
            numpy==1.26.4 \
            pillow==12.2.0 \
            tqdm==4.67.3

      - name: Verify codec dependency imports
        run: |
          python -m pip check
          python - <<'PY'
          import compressai
          import timm
          import torch
          import torchvision
          from atic.model import ATICModel

          print("torch", torch.__version__)
          print("torchvision", torchvision.__version__)
          print("compressai", compressai.__version__)
          print("timm", timm.__version__)
          print("ATICModel", ATICModel.__name__)
          PY

      - name: Run container and neural-codec tests
        run: python -m unittest discover -v
